<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asisten AI & Jadwal Permanen</title>
  <!-- Styling visual menggunakan Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library Client Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-2xl mx-auto bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-indigo-400">🤖 Asisten Jadwal AI</h1>
      <span class="text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full font-mono">Status: Cloud SQL Active</span>
    </div>

    <!-- Area Input Kegiatan -->
    <div class="space-y-4 mb-8">
      <label class="block text-sm font-medium text-slate-300">Tulis rencana kegiatanmu hari ini:</label>
      <textarea id="userInput" rows="3" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-100 placeholder-slate-500" placeholder="Contoh: Rapat jam 9 pagi, belajar koding jam 1 siang, lalu gym jam 4 sore..."></textarea>
      
      <button onclick="prosesDenganAI()" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
        <span>✨ Minta AI Susunkan Jadwal</span>
      </button>
    </div>

    <!-- Tampilan Daftar Jadwal -->
    <div>
      <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center justify-between">
        <span>📅 Jadwal Hari Ini (Database SQL)</span>
        <button onclick="muatDataPermanen()" class="text-xs text-indigo-400 hover:underline">🔄 Refresh Data</button>
      </h2>
      <div id="loading" class="hidden text-center text-indigo-400 py-4 font-medium animate-pulse">Asisten AI sedang menyusun jadwal & menyimpan ke SQL...</div>
      
      <ul id="scheduleList" class="space-y-3">
        <!-- Data kegiatan dari database SQL akan dimuat di sini -->
      </ul>
    </div>
  </div>

  <!-- Memuat logika JavaScript -->
  <script src="script.js"></script>
</body>
</html>
